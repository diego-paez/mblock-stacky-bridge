[project]
name = "stacky-hub"
version = "0.1.0"
description = "MCP server + protocol library to drive a Makeblock mBot2 safely from Stack-chan/LLMs"
requires-python = ">=3.10"
dependencies = ["mcp>=1.27,<2.0", "bleak>=0.22", "pyserial>=3.5"]

[project.scripts]
stacky-hub = "stacky_hub.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stacky_hub"]
