; Stacky teleop joystick: M5StickC Plus + JoyC hat -> Wi-Fi UDP -> Stack-chan -> mBot2.
; Spec: ../../docs/teleop.md
;
; Upload speed is 115200 on purpose: this StickC Plus's USB-serial adapter drops
; out at higher rates (measured 2026-09-27; 460800 and 1500000 both failed).

[env:m5stick-c-plus]
platform      = espressif32@6.9.0
board         = m5stick-c
framework     = arduino
monitor_speed = 115200
upload_speed  = 115200
lib_deps      = m5stack/M5Unified@^0.2.2
                m5stack/M5Hat-Mini-JoyC@^0.0.1
build_flags   = -DCORE_DEBUG_LEVEL=0
